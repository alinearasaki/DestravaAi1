<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DestravaAí - Roleta Anti-Paralisia TDAH</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel para JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @keyframes spin-slow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(1080deg); }
        }
        .animate-spin-wheel {
            animation: spin-slow 2.8s cubic-bezier(0.15, 0.9, 0.2, 1) forwards;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans p-2 sm:p-4 h-auto">

    <div id="root" class="w-full"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            // Lista de tarefas
            const [tasks, setTasks] = useState(() => {
                try {
                    const saved = localStorage.getItem('destrava_ai_tasks');
                    return saved ? JSON.parse(saved) : [
                        { id: '1', text: 'Responder e-mails ou mensagens pendentes' },
                        { id: '2', text: 'Organizar a mesa de trabalho por 5 minutos' },
                        { id: '3', text: 'Beber um copo d\'água e levantar' }
                    ];
                } catch (e) {
                    return [];
                }
            });

            const [newTaskText, setNewTaskText] = useState('');
            const [isSpinning, setIsSpinning] = useState(false);
            const [selectedTask, setSelectedTask] = useState(null);
            
            // Timer Flexível (15, 25, 45 min)
            const [selectedMinutes, setSelectedMinutes] = useState(15);
            const [timerActive, setTimerActive] = useState(false);
            const [timeLeft, setTimeLeft] = useState(15 * 60);

            // Banner de Instalação na Tela Inicial
            const [showInstallBanner, setShowInstallBanner] = useState(true);

            // Persistência
            useEffect(() => {
                try {
                    localStorage.setItem('destrava_ai_tasks', JSON.stringify(tasks));
                } catch (e) {
                    console.error(e);
                }
            }, [tasks]);

            // Timer Tick
            useEffect(() => {
                let interval = null;
                if (timerActive && timeLeft > 0) {
                    interval = setInterval(() => {
                        setTimeLeft(prev => prev - 1);
                    }, 1000);
                } else if (timeLeft === 0) {
                    setTimerActive(false);
                    alert("⏰ Bloco concluído! Sensação de dever cumprido sem paralisia!");
                }
                return () => clearInterval(interval);
            }, [timerActive, timeLeft]);

            // Adicionar Tarefa
            const addTask = (e) => {
                e.preventDefault();
                if (!newTaskText.trim()) return;
                const newTask = {
                    id: Date.now().toString(),
                    text: newTaskText.trim()
                };
                setTasks(prev => [...prev, newTask]);
                setNewTaskText('');
            };

            // Remover Tarefa
            const removeTask = (id) => {
                setTasks(prev => prev.filter(t => t.id !== id));
            };

            // Girar a Roleta
            const spinWheel = () => {
                if (tasks.length === 0 || isSpinning) return;
                setIsSpinning(true);
                setSelectedTask(null);
                setTimerActive(false);

                setTimeout(() => {
                    const randomIndex = Math.floor(Math.random() * tasks.length);
                    setSelectedTask(tasks[randomIndex]);
                    setIsSpinning(false);
                }, 2800);
            };

            // Alterar Tempo do Foco
            const handleSetTime = (mins) => {
                setSelectedMinutes(mins);
                setTimeLeft(mins * 60);
                setTimerActive(false);
            };

            // Concluir e Eliminar
            const completeTask = () => {
                if (selectedTask) {
                    setTasks(prev => prev.filter(t => t.id !== selectedTask.id));
                    setSelectedTask(null);
                    setTimerActive(false);
                }
            };

            // Formatar Segundos
            const formatTime = (seconds) => {
                const m = Math.floor(seconds / 60);
                const s = seconds % 60;
                return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            };

            return (
                <div className="max-w-md mx-auto bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden p-5 space-y-5">
                    
                    {/* Banner de Adicionar à Tela Inicial */}
                    {showInstallBanner && (
                        <div className="bg-indigo-50 border border-indigo-200 rounded-xl p-3 flex items-start justify-between gap-2 text-xs text-indigo-900">
                            <div className="space-y-1">
                                <span className="font-bold flex items-center gap-1 text-indigo-700">
                                    📲 Dica de Acesso Rápido
                                </span>
                                <p className="text-[11px] leading-tight text-slate-600">
                                    Para abrir este app direto do celular sem travar: no iPhone toque em <b>Compartilhar → Adicionar à Tela de Início</b>. No Android, clique nos <b>3 pontinhos → Instalar aplicativo</b>.
                                </p>
                            </div>
                            <button 
                                onClick={() => setShowInstallBanner(false)}
                                className="text-slate-400 hover:text-slate-600 font-bold px-1"
                            >
                                ×
                            </button>
                        </div>
                    )}

                    {/* Header */}
                    <div className="text-center space-y-1">
                        <div className="inline-flex items-center gap-1.5 text-indigo-600 font-bold text-xs uppercase tracking-widest bg-indigo-50 px-3 py-1 rounded-full">
                            ⚡ Zero Decisões
                        </div>
                        <h1 className="text-2xl font-black text-slate-900 tracking-tight">DestravaAí</h1>
                        <p className="text-xs text-slate-500">
                            A roleta escolhe por você. Sem dúvida, sem ansiedade e sem paralisia!
                        </p>
                    </div>

                    {/* Resultado Escolhido */}
                    {selectedTask ? (
                        <div className="bg-gradient-to-br from-indigo-900 to-slate-900 text-white rounded-2xl p-5 text-center space-y-4 shadow-lg border border-indigo-500/30">
                            <span className="text-xs font-bold bg-emerald-400 text-slate-950 px-3 py-1 rounded-full uppercase tracking-wider">
                                Sua Única Missão Agora
                            </span>
                            
                            <h2 className="text-xl font-bold leading-snug">
                                "{selectedTask.text}"
                            </h2>

                            {/* Timer */}
                            <div className="bg-black/30 rounded-xl p-3.5 backdrop-blur-sm border border-white/10 space-y-2">
                                <div className="flex justify-center gap-1 text-xs">
                                    <button 
                                        onClick={() => handleSetTime(15)}
                                        className={`px-2 py-0.5 rounded font-bold ${selectedMinutes === 15 ? 'bg-indigo-500 text-white' : 'bg-white/10 text-indigo-200'}`}
                                    >
                                        15m
                                    </button>
                                    <button 
                                        onClick={() => handleSetTime(25)}
                                        className={`px-2 py-0.5 rounded font-bold ${selectedMinutes === 25 ? 'bg-indigo-500 text-white' : 'bg-white/10 text-indigo-200'}`}
                                    >
                                        25m
                                    </button>
                                    <button 
                                        onClick={() => handleSetTime(45)}
                                        className={`px-2 py-0.5 rounded font-bold ${selectedMinutes === 45 ? 'bg-indigo-500 text-white' : 'bg-white/10 text-indigo-200'}`}
                                    >
                                        45m
                                    </button>
                                </div>

                                <div className="text-3xl font-mono font-black my-1">
                                    {formatTime(timeLeft)}
                                </div>
                                
                                {!timerActive ? (
                                    <button 
                                        onClick={() => setTimerActive(true)}
                                        className="w-full py-2 bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-slate-950 font-bold rounded-lg text-xs transition-all"
                                    >
                                        ▶ Iniciar Bloco ({selectedMinutes}m)
                                    </button>
                                ) : (
                                    <button 
                                        onClick={() => setTimerActive(false)}
                                        className="w-full py-1.5 bg-white/10 hover:bg-white/20 text-xs font-medium rounded-lg transition-all"
                                    >
                                        Pausar Cronômetro
                                    </button>
                                )}
                            </div>

                            <div className="flex gap-2 pt-1">
                                <button 
                                    onClick={completeTask}
                                    className="flex-1 py-2.5 bg-white text-indigo-950 hover:bg-slate-100 font-black rounded-xl text-xs transition-all active:scale-95"
                                >
                                    ✅ Feito! (Eliminar)
                                </button>
                                <button 
                                    onClick={spinWheel}
                                    className="py-2.5 px-3 bg-white/10 hover:bg-white/20 text-white font-medium rounded-xl text-xs transition-all"
                                >
                                    🔄 Rodar Outra
                                </button>
                            </div>
                        </div>
                    ) : (
                        /* Roleta */
                        <div className="flex flex-col items-center justify-center py-2">
                            <div className={`relative w-36 h-36 rounded-full border-8 border-indigo-100 flex items-center justify-center bg-indigo-50 transition-all ${isSpinning ? 'animate-spin-wheel' : ''}`}>
                                <div className="text-4xl">🎰</div>
                                <div className="absolute -top-3 left-1/2 -translate-x-1/2 text-indigo-600 text-base">▼</div>
                            </div>

                            <button
                                onClick={spinWheel}
                                disabled={tasks.length === 0 || isSpinning}
                                className={`mt-5 w-full py-3 px-5 rounded-xl font-bold text-sm shadow-md transition-all active:scale-95 ${
                                    tasks.length === 0 
                                        ? 'bg-slate-200 text-slate-400 cursor-not-allowed'
                                        : 'bg-indigo-600 hover:bg-indigo-700 text-white shadow-indigo-100'
                                }`}
                            >
                                {isSpinning ? 'Sorteando tarefa...' : '🎲 Sortear Tarefa Agora!'}
                            </button>
                        </div>
                    )}

                    {/* Formulário */}
                    <form onSubmit={addTask} className="space-y-1.5">
                        <label className="text-xs font-bold text-slate-700 uppercase tracking-wider block">
                            Adicionar Tarefa Pendente
                        </label>
                        <div className="flex gap-2">
                            <input
                                type="text"
                                value={newTaskText}
                                onChange={(e) => setNewTaskText(e.target.value)}
                                placeholder="Ex: Pagar conta, enviar e-mail..."
                                className="flex-1 px-3 py-2 text-xs rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-50"
                            />
                            <button
                                type="submit"
                                className="px-3.5 py-2 bg-slate-900 text-white hover:bg-slate-800 font-bold rounded-xl text-xs transition-all active:scale-95"
                            >
                                + Add
                            </button>
                        </div>
                    </form>

                    {/* Lista */}
                    <div className="space-y-1.5 pt-2 border-t border-slate-100">
                        <div className="flex justify-between items-center text-xs text-slate-500 font-medium">
                            <span>Sua Lista de Tarefas ({tasks.length})</span>
                            {tasks.length > 0 && (
                                <button onClick={() => setTasks([])} className="text-rose-500 hover:underline">
                                    Limpar tudo
                                </button>
                            )}
                        </div>

                        <div className="max-h-36 overflow-y-auto space-y-1 pr-1">
                            {tasks.length === 0 ? (
                                <p className="text-xs text-slate-400 text-center py-3 italic">
                                    Sua lista está limpa. Adicione tarefas para girar a roleta!
                                </p>
                            ) : (
                                tasks.map((task) => (
                                    <div 
                                        key={task.id}
                                        className="flex justify-between items-center bg-slate-50 border border-slate-100 px-3 py-1.5 rounded-lg text-xs text-slate-700"
                                    >
                                        <span className="truncate pr-2">{task.text}</span>
                                        <button 
                                            onClick={() => removeTask(task.id)}
                                            className="text-slate-300 hover:text-rose-500 text-sm font-bold px-1"
                                        >
                                            ×
                                        </button>
                                    </div>
                                ))
                            )}
                        </div>
                    </div>

                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
